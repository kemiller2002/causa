name: Build and test

# Every pull request and every push to main builds the F# engine and runs its
# tests, type-checks the browser kernel, and drives the pages in a real
# browser. Branch protection requires this job (.github/branch-protection.json).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The browser suite drives the built app in Chromium and WebKit (about
    # 95 tests each, one worker against one double), which takes most of an
    # hour. Anything that stalls fails here instead of holding a runner for
    # the six-hour default.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Warnings are errors (Directory.Build.props), so this also gates
      # warning regressions.
      - name: Build
        run: dotnet build App.slnx -c Release
      - name: Test
        shell: bash
        run: |
          set -uo pipefail
          output=$(dotnet test App.slnx -c Release --no-build 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! echo "$output" | grep -qE 'Passed:[[:space:]]*[1-9]'; then
            echo "::error::No test passed. An empty test run is not a pass."; exit 1
          fi
          if echo "$output" | grep -qE 'Skipped:[[:space:]]*[1-9]'; then
            echo "::error::Tests were skipped. A run that skips tests is not a pass."; exit 1
          fi
      - name: Install npm dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json is not committed; installing without a lockfile. Commit it so every run installs the same tree."
            npm install --no-audit --no-fund
          fi

      - name: Type-check the browser kernel
        run: npm run check

      # The browser specs drive the built application (/dist/index.html); without this step every app spec waits for
      # a page that 404s. `npm run build` is `dotnet fsi build.fsx` and needs no secrets: dist/deploy-connection.json
      # holds the schema only, so the app shows the Connect form.
      - name: Build the site
        run: npm run build

      - name: Require the site bundle
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::npm run build did not write dist/index.html; the browser specs need it."
            exit 1
          fi

      # The specs answer GitHub from the governed harness GitHub double (synthetic, never real-provider evidence),
      # seeded with causa-data's demonstration catalog. Both repositories are public and pinned to exact commits,
      # checked out read-only next to this one.
      - name: Check out the harness double (Indy-init, pinned)
        uses: actions/checkout@v4
        with:
          repository: kemiller2002/Indy-init
          ref: dae2347d26d0fb7dccc36484033515bbbaa31675
          path: .ci/indy-init
          persist-credentials: false
          sparse-checkout: verification/harness
      - name: Check out the demonstration catalog (causa-data, pinned)
        uses: actions/checkout@v4
        with:
          repository: kemiller2002/causa-data
          ref: 7e10394cc95b47f7dfa5baf2e5b3a68b929bf9c4
          path: .ci/causa-data
          persist-credentials: false

      - name: Start and seed the harness GitHub double on port 4611
        timeout-minutes: 2
        run: |
          nohup node .ci/indy-init/verification/harness/github-double.mjs 4611 > "$RUNNER_TEMP/github-double.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null -H "authorization: Bearer harness-token" http://127.0.0.1:4611/repos/harness/causa-test; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -H "authorization: Bearer harness-token" http://127.0.0.1:4611/repos/harness/causa-test \
            || { echo "::error::The harness GitHub double did not answer on port 4611."; cat "$RUNNER_TEMP/github-double.log"; exit 1; }
          node tests/browser/support/seed-harness-double.mjs .ci/causa-data http://127.0.0.1:4611

      # Chromium is never installed with `--with-deps`: that runs `sudo
      # apt-get update` on every run, and apt has no overall deadline, so an
      # unanswered mirror hung browser suites until the six-hour job limit
      # (signal#21, signal#22, summa#21; fixed in signal#24). The browser is
      # cached under the installed Playwright version (which fixes the
      # browser build), and the OS libraries are proved present offline.
      - name: Resolve the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # A stalled cache download falls back to a fresh browser download
      # after two minutes instead of the default ten.
      - name: Restore the Chromium build for that version
        id: chromium-cache
        uses: actions/cache@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Download Chromium for the browser suite
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # `ldd` proves offline that every shared library the Chromium binaries
      # link against is on the runner. Only when a future runner image drops
      # one does apt run at all, with per-request timeouts, retries and an
      # overall deadline, and the result is checked again. A missing library
      # fails the step by name; it can no longer hang.
      - name: Verify Chromium's OS libraries
        timeout-minutes: 8
        run: |
          missing_libraries() {
            find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -print0 \
              | xargs -0 --no-run-if-empty ldd \
              | awk '/not found/ { print $1 }' \
              | sort -u
          }

          missing="$(missing_libraries)"
          if [ -n "$missing" ]; then
            echo "::warning::Runner image lacks Chromium libraries: $(echo $missing). Installing Chromium's OS dependencies."
            printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
              | sudo tee /etc/apt/apt.conf.d/99-bounded-network > /dev/null
            timeout 300 npx playwright install-deps chromium \
              || echo "::error::Installing Chromium's OS dependencies failed or took longer than five minutes."
          fi

          still_missing="$(missing_libraries)"
          if [ -n "$still_missing" ]; then
            echo "::error::Chromium cannot start; missing shared libraries: $(echo $still_missing)"
            exit 1
          fi
          echo "Every shared library Chromium links against is present."

      # playwright.config defines chromium and webkit (the plan's SU-BROWSER-WEBKIT); without this step every
      # WebKit test fails at launch. Bounded, like the Verification gate's browser install.
      - name: Download WebKit and its OS libraries for the browser suite
        timeout-minutes: 15
        run: npx playwright install --with-deps webkit

      # Excluded here, and why:
      #   tests/browser/live/ (PERSIST-041, PERSIST-049, UI-006): they need the live test repository's credentials
      #   (CAUSA_WRITE_TOKEN, CAUSA_GITHUB_TOKEN), which this job does not have; they run in the Verification gate,
      #   as ci.yml leaves the .NET Live suites to it. CAUSA_EXCLUDE_LIVE_BROWSER=1 makes playwright.config.ts ignore
      #   that directory. Nothing else is excluded.
      # A test with no timeout of its own fails after a minute (playwright.config.ts), the run stops after ten
      # failures, and the step has its own deadline, so a broken app fails fast instead of holding the job.
      - name: Verify the pages in a real browser
        timeout-minutes: 55
        env:
          CAUSA_EXCLUDE_LIVE_BROWSER: "1"
          CAUSA_PROVIDER: harness-double
          CAUSA_DOUBLE_URL: http://127.0.0.1:4611
        run: npx playwright test -c playwright.config.ts --max-failures=10

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            ${{ runner.temp }}/github-double.log
          retention-days: 7
