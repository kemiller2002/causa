name: Praxis validation

# One run per ref: a pull request's pushes run through `pull_request` only,
# and a newer push cancels the superseded run. Pushing to every branch as well
# ran each pull-request push twice, with no group, and no timeout; Rehearsal 6
# started 144 of these runs in seven hours (Indy-init R7-REM-004,
# `conditor ci-policy check` rules CIP-002, CIP-005 and CIP-006).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ./praxis installs and runs the Praxis version this project pins; it
      # needs only a POSIX shell and curl. .NET is here only for the tool-usage
      # recorder (tools/usage/usage.fsx, docs/tool-usage.md), which runs
      # ./praxis unchanged (same output, same exit code) and records the
      # invocation. The records go to the runner's temporary directory, never
      # into the checkout, and are uploaded as an artifact; nothing from CI is
      # committed. A recording failure only warns.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet fsi tools/usage/usage.fsx -- run praxis -- registry check
        env:
          CAUSA_TOOL_USAGE_DIR: ${{ runner.temp }}/tool-usage
      - run: dotnet fsi tools/usage/usage.fsx -- run praxis -- validate
        env:
          CAUSA_TOOL_USAGE_DIR: ${{ runner.temp }}/tool-usage
          PRAXIS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Compatibility: Praxis releases pinned from before the rename read
          # only the legacy name (DF-ROS-2026-A050).
          ROS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload the tool-usage records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-usage-praxis-validation
          path: ${{ runner.temp }}/tool-usage/
          if-no-files-found: ignore
          retention-days: 30
